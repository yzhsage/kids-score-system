<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多多與球球行為計分板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-12">

  <!-- 頂部導覽與學生切換 -->
  <header class="bg-slate-900 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold">🏠 家庭計分系統</h1>
      <div class="flex gap-2">
        <button id="btn-student-1" onclick="switchStudent(1)" class="px-4 py-1.5 rounded-full font-bold transition bg-sky-500 text-white">多多</button>
        <button id="btn-student-2" onclick="switchStudent(2)" class="px-4 py-1.5 rounded-full font-bold transition bg-slate-700 text-slate-300">球球</button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-6">

    <!-- 週次切換控制器 -->
    <div class="bg-slate-800 text-white rounded-2xl p-4 shadow-sm flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center gap-2">
        <button onclick="changeWeek(-1)" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg text-sm font-bold transition">‹ 上一週</button>
        <button onclick="changeWeek(1)" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg text-sm font-bold transition">下一週 ›</button>
        <button onclick="resetToCurrentWeek()" class="bg-sky-600 hover:bg-sky-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">回本週</button>
      </div>
      <div class="text-sm font-semibold tracking-wide">
        📅 週次區間：<span id="week-range-text" class="text-sky-300"></span>
      </div>
    </div>

    <!-- 結算卡片（當週得分 vs 歷史累積總得分） -->
    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- 當週統計 -->
      <div class="space-y-2 border-b md:border-b-0 md:border-r border-slate-100 pb-4 md:pb-0 md:pr-6">
        <div class="text-sm text-slate-500 font-medium">當前學生：<span id="current-student-name" class="font-bold text-slate-800">多多</span></div>
        <div class="text-xl font-bold text-slate-700">當週得分：<span id="week-points" class="text-sky-600">0</span> 點</div>
        <div class="text-sm text-slate-500">當週預計可領：<span class="font-bold text-amber-600">$ <span id="week-money">0</span></span></div>
      </div>

      <!-- 累積總分與金額/扣點管理 -->
      <div class="space-y-2">
        <div class="flex items-center justify-between">
          <div class="text-sm text-slate-500 font-medium">歷史累積金額與總分</div>
          <button onclick="toggleOverrideInput()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 border border-slate-300 px-2 py-1 rounded-lg">⚙️ 修改總分/扣點扣款</button>
        </div>
        <div class="text-2xl font-black text-slate-800">累積剩餘總分：<span id="total-points" class="text-emerald-600">0</span> 點</div>
        <div class="text-2xl font-black text-amber-600">總剩餘可領金額：$ <span id="total-money">0</span></div>

        <!-- 修改原始總分 & 金額/點數扣除控制面板 -->
        <div id="override-box" class="hidden mt-3 p-4 bg-amber-50 border border-amber-200 rounded-xl space-y-4 text-xs">
          
          <!-- 1. 修改原始總點數 -->
          <div class="p-2 bg-white rounded-lg border border-amber-200 space-y-2">
            <div class="font-bold text-amber-900">✏️ 修改原始累積點數基準：</div>
            <div class="flex items-center gap-2">
              <input type="number" id="manual-base-input" placeholder="輸入新原始總點數" class="w-32 border border-slate-300 rounded px-2 py-1 text-sm">
              <button onclick="saveManualBasePoints()" class="bg-sky-600 hover:bg-sky-700 text-white font-bold px-2 py-1 rounded">更新總點數</button>
              <button onclick="resetManualBasePoints()" class="bg-slate-200 hover:bg-slate-300 text-slate-600 font-bold px-2 py-1 rounded">恢復自動計算</button>
            </div>
          </div>

          <!-- 2. 金額/點數扣除 -->
          <div class="p-2 bg-white rounded-lg border border-amber-200 space-y-2">
            <div class="font-bold text-amber-900">🛒 新增扣除紀錄：</div>
            <div class="flex flex-wrap items-center gap-2">
              <input type="text" id="deduct-note-input" placeholder="說明 (例: 買玩具/領零用錢)" class="w-32 border border-slate-300 rounded px-2 py-1 text-sm">
              <input type="number" id="deduct-money-input" placeholder="金額 (元)" class="w-20 border border-slate-300 rounded px-2 py-1 text-sm">
              <span class="font-bold text-slate-400">或</span>
              <input type="number" id="deduct-points-input" placeholder="點數" class="w-20 border border-slate-300 rounded px-2 py-1 text-sm">
              <button onclick="addDeduction()" class="bg-rose-600 hover:bg-rose-700 text-white font-bold px-3 py-1 rounded">直接扣除</button>
            </div>
            <div class="text-[11px] text-amber-800/80">
              💡 填金額會自動無條件進位扣點；填點數則直接扣除。
            </div>
          </div>

          <!-- 3. 歷次扣除明細列表 -->
          <div>
            <div class="font-bold text-slate-700 mb-1">📜 歷次扣減明細：</div>
            <ul id="deduction-log-list" class="divide-y divide-amber-200/60 max-h-32 overflow-y-auto pr-1">
              <!-- JS 動態渲染 -->
            </ul>
          </div>

        </div>
      </div>

    </div>

    <!-- 矩陣計分表格（含整張表格照片上傳與顯示） -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 overflow-x-auto space-y-4">
      <div class="flex justify-between items-center min-w-[650px]">
        <h2 class="font-bold text-lg text-slate-700">📋 行為紀錄表</h2>
        
        <!-- 表格共用拍照/上傳按鈕 -->
        <label class="cursor-pointer bg-sky-50 hover:bg-sky-100 text-sky-700 border border-sky-300 font-bold px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1">
          📷 <span id="table-photo-btn-text">拍照 / 上傳本週表格照片</span>
          <input type="file" id="table-photo-input" accept="image/*" capture="environment" class="hidden" onchange="uploadTablePhoto(event)">
        </label>
      </div>

      <!-- 照片預覽區塊 (上傳後顯示) -->
      <div id="table-photo-container" class="hidden min-w-[650px] bg-slate-50 border border-slate-200 rounded-xl p-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <img id="table-photo-preview" src="" class="w-16 h-16 object-cover rounded-lg border border-slate-300 cursor-pointer shadow-sm hover:scale-105 transition" onclick="openTableImageModal()">
          <div>
            <div class="font-bold text-sm text-slate-700">📷 本週紙本紀錄表照片</div>
            <div class="text-xs text-slate-400">點擊縮圖可放大檢視</div>
          </div>
        </div>
        <button onclick="deleteTablePhoto()" class="text-xs text-rose-500 hover:text-rose-700 font-bold px-2 py-1 bg-rose-50 border border-rose-200 rounded-lg">刪除照片</button>
      </div>

      <table class="w-full text-center border-collapse min-w-[650px]">
        <thead>
          <tr class="bg-slate-100 text-slate-600 text-sm">
            <th class="p-2 border border-slate-200 text-left w-32">項目 / 日期</th>
            <th class="p-2 border border-slate-200" id="th-day-0">一<br><button onclick="toggleDayType(0)" class="text-[10px] px-1.5 py-0.5 rounded mt-1 font-normal bg-sky-100 text-sky-800" id="btn-type-0">上課</button></th>
            <th class="p-2 border border-slate-200" id="th-day-1">二<br><button onclick="toggleDayType(1)" class="text-[10px] px-1.5 py-0.5 rounded mt-1 font-normal bg-sky-100 text-sky-800" id="btn-type-1">上課</button></th>
            <th class="p-2 border border-slate-200" id="th-day-2">三<br><button onclick="toggleDayType(2)" class="text-[10px] px-1.5 py-0.5 rounded mt-1 font-normal bg-sky-100 text-sky-800" id="btn-type-2">上課</button></th>
            <th class="p-2 border border-slate-200" id="th-day-3">四<br><button onclick="toggleDayType(3)" class="text-[10px] px-1.5 py-0.5 rounded mt-1 font-normal bg-sky-100 text-sky-800" id="btn-type-3">上課</button></th>
            <th class="p-2 border border-slate-200" id="th-day-4">五<br><button onclick="toggleDayType(4)" class="text-[10px] px-1.5 py-0.5 rounded mt-1 font-normal bg-sky-100 text-sky-800" id="btn-type-4">上課</button></th>
            <th class="p-2 border border-slate-200 bg-amber-50" id="th-day-5">六<br><button onclick="toggleDayType(5)" class="text-[10px] px-1.5 py-0.5 rounded mt-1 font-normal bg-amber-200 text-amber-900" id="btn-type-5">假日</button></th>
            <th class="p-2 border border-slate-200 bg-amber-50" id="th-day-6">日<br><button onclick="toggleDayType(6)" class="text-[10px] px-1.5 py-0.5 rounded mt-1 font-normal bg-amber-200 text-amber-900" id="btn-type-6">假日</button></th>
          </tr>
        </thead>
        <tbody id="matrix-tbody" class="text-sm">
          <!-- JS 渲染內容 -->
        </tbody>
      </table>
    </div>

    <!-- 額外加減分專區 -->
    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
      <h2 class="font-bold text-lg text-slate-700 mb-4">✨ 額外加減分事項</h2>
      
      <div class="flex flex-col sm:flex-row gap-2 mb-4">
        <input type="text" id="extra-note" placeholder="事項說明（如：幫忙洗碗、表現優良）" class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
        <input type="number" id="extra-points" placeholder="分數 (+2 或 -1)" class="w-full sm:w-28 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
        <button onclick="addExtraScore()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-lg text-sm transition">新增紀錄</button>
      </div>

      <ul id="extra-list" class="divide-y divide-slate-100 text-sm">
        <!-- 額外紀錄列表 -->
      </ul>
    </div>

  </main>

  <!-- 照片放大預覽 Modal -->
  <div id="image-modal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4" onclick="closeImageModal()">
    <img id="modal-img" src="" class="max-w-full max-h-[90vh] rounded-lg shadow-xl object-contain">
  </div>

  <script>
    const SUPABASE_URL = 'https://mghhdyhbgjrrvxoqfkct.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_uAyNrVMDY2W63c0ujUPwUg_347hhWbW';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const GRADE_MAP = { 'A': 3, 'B': 1, 'C': 0, 'D': -1, 'E': -2, '-': 0 };
    const GRADE_SEQUENCE = ['-', 'A', 'B', 'C', 'D', 'E'];
    
    const ITEMS_COMMON = ['起床', '中晝頓', '歇晝', '收𨑨迌物仔', '暗頓', '洗身軀', '歇睏'];
    const ITEMS_WEEKDAY = ['學校表現', '宿題', '收冊包'];
    const ITEMS_WEEKEND = ['算術', '語言', '行為'];

    let currentStudentId = 1;
    let studentNames = { 1: '多多', 2: '球球' };
    let currentWeekScores = {};
    let dayTypes = [false, false, false, false, false, true, true];
    let currentWeekOffset = 0;
    let weekDates = [];
    let allTimeScores = []; 

    let manualBasePoints = null;
    let deductionLogs = [];
    let currentTablePhotoUrl = null;

    function getWeekDates(offsetInWeeks = 0) {
      const now = new Date();
      now.setDate(now.getDate() + (offsetInWeeks * 7));
      
      const day = now.getDay() === 0 ? 7 : now.getDay();
      const monday = new Date(now);
      monday.setDate(now.getDate() - day + 1);

      const dates = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        dates.push(d.toISOString().split('T')[0]);
      }
      return dates;
    }

    function updateWeekDisplay() {
      weekDates = getWeekDates(currentWeekOffset);
      document.getElementById('week-range-text').innerText = `${weekDates[0]} ~ ${weekDates[6]}`;
    }

    function changeWeek(delta) {
      currentWeekOffset += delta;
      updateWeekDisplay();
      loadData();
    }

    function resetToCurrentWeek() {
      currentWeekOffset = 0;
      updateWeekDisplay();
      loadData();
    }

    function switchStudent(id) {
      currentStudentId = id;
      document.getElementById('current-student-name').innerText = studentNames[id];
      
      document.getElementById('btn-student-1').className = id === 1 ? 'px-4 py-1.5 rounded-full font-bold transition bg-sky-500 text-white' : 'px-4 py-1.5 rounded-full font-bold transition bg-slate-700 text-slate-300';
      document.getElementById('btn-student-2').className = id === 2 ? 'px-4 py-1.5 rounded-full font-bold transition bg-sky-500 text-white' : 'px-4 py-1.5 rounded-full font-bold transition bg-slate-700 text-slate-300';

      document.getElementById('override-box').classList.add('hidden');
      loadData();
    }

    function toggleDayType(dayIndex) {
      dayTypes[dayIndex] = !dayTypes[dayIndex];
      const btn = document.getElementById(`btn-type-${dayIndex}`);
      if (dayTypes[dayIndex]) {
        btn.innerText = '假日';
        btn.className = 'text-[10px] px-1.5 py-0.5 rounded mt-1 font-normal bg-amber-200 text-amber-900';
      } else {
        btn.innerText = '上課';
        btn.className = 'text-[10px] px-1.5 py-0.5 rounded mt-1 font-normal bg-sky-100 text-sky-800';
      }
      renderTable();
    }

    async function loadData() {
      // 1. 載入每日評分
      const { data: allData } = await _supabase
        .from('daily_scores')
        .select('*')
        .eq('student_id', currentStudentId);

      allTimeScores = allData || [];

      currentWeekScores = {};
      allTimeScores.forEach(s => {
        if (s.date >= weekDates[0] && s.date <= weekDates[6]) {
          currentWeekScores[`${s.date}_${s.item_name}`] = s.grade;
        }
      });

      // 2. 載入手動原始總點數設定
      const { data: overrideData } = await _supabase
        .from('student_overrides')
        .select('manual_base_points')
        .eq('student_id', currentStudentId)
        .maybeSingle();

      manualBasePoints = overrideData ? overrideData.manual_base_points : null;
      document.getElementById('manual-base-input').placeholder = manualBasePoints !== null ? `目前設定: ${manualBasePoints}` : '輸入新原始總點數';

      // 3. 載入扣減紀錄列表
      const { data: logsData } = await _supabase
        .from('deduction_logs')
        .select('*')
        .eq('student_id', currentStudentId)
        .order('created_at', { ascending: false });

      deductionLogs = logsData || [];
      renderDeductionLogs();

      // 4. 載入當週表格照片 (紀錄在週一的 TABLE_PHOTO 虛擬項目)
      const mondayDate = weekDates[0];
      const { data: tablePhotoData } = await _supabase
        .from('daily_scores')
        .select('image_url')
        .eq('student_id', currentStudentId)
        .eq('date', mondayDate)
        .eq('item_name', 'TABLE_PHOTO')
        .maybeSingle();

      if (tablePhotoData && tablePhotoData.image_url) {
        currentTablePhotoUrl = tablePhotoData.image_url;
        document.getElementById('table-photo-preview').src = currentTablePhotoUrl;
        document.getElementById('table-photo-container').classList.remove('hidden');
      } else {
        currentTablePhotoUrl = null;
        document.getElementById('table-photo-container').classList.add('hidden');
      }

      renderTable();
      loadExtraScores();
    }

    function renderTable() {
      const tbody = document.getElementById('matrix-tbody');
      tbody.innerHTML = '';

      const allItems = [...ITEMS_COMMON, ...ITEMS_WEEKDAY, ...ITEMS_WEEKEND];

      allItems.forEach(item => {
        const tr = document.createElement('tr');
        let rowHtml = `<td class="p-2 border border-slate-200 font-bold text-left bg-slate-50">${item}</td>`;

        weekDates.forEach((date, index) => {
          const isWeekendType = dayTypes[index];
          const isWeekdayItem = ITEMS_WEEKDAY.includes(item);
          const isWeekendItem = ITEMS_WEEKEND.includes(item);

          if ((isWeekendType && isWeekdayItem) || (!isWeekendType && isWeekendItem)) {
            rowHtml += `<td class="p-2 border border-slate-200 bg-slate-100/50 text-slate-300">-</td>`;
          } else {
            const key = `${date}_${item}`;
            const grade = currentWeekScores[key] || '-';
            const badgeClass = getBadgeClass(grade);

            rowHtml += `
              <td class="p-2 border border-slate-200 hover:bg-sky-50 cursor-pointer transition select-none" onclick="toggleGrade('${date}', '${item}', '${grade}')">
                <span class="inline-block w-7 h-7 leading-7 rounded-full font-bold text-xs ${badgeClass}">${grade}</span>
              </td>
            `;
          }
        });

        tr.innerHTML = rowHtml;
        tbody.appendChild(tr);
      });

      calculateTotal();
    }

    function getBadgeClass(grade) {
      switch(grade) {
        case 'A': return 'bg-emerald-100 text-emerald-700 border border-emerald-300';
        case 'B': return 'bg-sky-100 text-sky-700 border border-sky-300';
        case 'C': return 'bg-slate-100 text-slate-600';
        case 'D': return 'bg-amber-100 text-amber-700 border border-amber-300';
        case 'E': return 'bg-rose-100 text-rose-700 border border-rose-300';
        default: return 'text-slate-300';
      }
    }

    async function toggleGrade(date, item, currentGrade) {
      const nextIdx = (GRADE_SEQUENCE.indexOf(currentGrade) + 1) % GRADE_SEQUENCE.length;
      const nextGrade = GRADE_SEQUENCE[nextIdx];

      currentWeekScores[`${date}_${item}`] = nextGrade;

      const scoreObj = GRADE_MAP[nextGrade];
      const dayOfWeek = new Date(date).getDay() || 7;

      await _supabase.from('daily_scores').upsert({
        student_id: currentStudentId,
        date: date,
        day_of_week: dayOfWeek,
        item_name: item,
        grade: nextGrade,
        score: scoreObj,
        is_edited: true
      }, { onConflict: 'student_id,date,item_name' });

      loadData();
    }

    // 上傳整張表格照片
    async function uploadTablePhoto(event) {
      const file = event.target.files[0];
      if (!file) return;

      document.getElementById('table-photo-btn-text').innerText = '上傳中...';
      const mondayDate = weekDates[0];
      const fileName = `table_${currentStudentId}_${mondayDate}_${Date.now()}_${file.name}`;

      // 1. 上傳檔案至 Supabase Storage
      const { data: uploadData, error: uploadError } = await _supabase.storage
        .from('receipts')
        .upload(fileName, file);

      if (uploadError) {
        alert('照片上傳失敗：' + uploadError.message);
        document.getElementById('table-photo-btn-text').innerText = '拍照 / 上傳本週表格照片';
        event.target.value = '';
        return;
      }

      // 2. 取得公開存取網址
      const { data: urlData } = _supabase.storage
        .from('receipts')
        .getPublicUrl(fileName);
      
      const imageUrl = urlData.publicUrl;

      // 3. 寫入 daily_scores 資料表 (補充完整預設欄位)
      const { error: dbError } = await _supabase.from('daily_scores').upsert({
        student_id: currentStudentId,
        date: mondayDate,
        day_of_week: 1,
        item_name: 'TABLE_PHOTO',
        grade: '-',
        score: 0,
        image_url: imageUrl,
        is_edited: false
      }, { onConflict: 'student_id,date,item_name' });

      if (dbError) {
        alert('照片儲存至資料庫失敗：' + dbError.message);
      } else {
        alert('表格照片上傳成功！');
        await loadData();
      }

      document.getElementById('table-photo-btn-text').innerText = '拍照 / 上傳本週表格照片';
      event.target.value = '';
    }

    // 刪除表格照片
    async function deleteTablePhoto() {
      if (!confirm('確定要刪除本週的表格照片嗎？')) return;

      const mondayDate = weekDates[0];
      await _supabase.from('daily_scores')
        .delete()
        .eq('student_id', currentStudentId)
        .eq('date', mondayDate)
        .eq('item_name', 'TABLE_PHOTO');

      loadData();
    }

    function openTableImageModal() {
      if (currentTablePhotoUrl) {
        openImageModal(currentTablePhotoUrl);
      }
    }

    function toggleOverrideInput() {
      const box = document.getElementById('override-box');
      box.classList.toggle('hidden');
    }

    async function saveManualBasePoints() {
      const val = parseInt(document.getElementById('manual-base-input').value);
      if (isNaN(val)) return alert('請輸入有效的數字分數！');

      await _supabase.from('student_overrides').upsert({
        student_id: currentStudentId,
        manual_base_points: val
      });

      alert(`已成功將 ${studentNames[currentStudentId]} 的原始總點數修改為：${val} 點`);
      document.getElementById('manual-base-input').value = '';
      loadData();
    }

    async function resetManualBasePoints() {
      await _supabase.from('student_overrides').delete().eq('student_id', currentStudentId);
      alert('已恢復為系統自動計算原始總分！');
      loadData();
    }

    async function addDeduction() {
      const note = document.getElementById('deduct-note-input').value.trim() || '扣除項';
      const money = parseFloat(document.getElementById('deduct-money-input').value);
      const points = parseInt(document.getElementById('deduct-points-input').value);

      let ptsToDeduct = 0;
      let amountMoney = 0;

      if (!isNaN(money) && money > 0) {
        amountMoney = money;
        ptsToDeduct = Math.ceil(money / 5);
      } else if (!isNaN(points) && points > 0) {
        ptsToDeduct = points;
      } else {
        return alert('請填寫欲扣除的金額或點數！');
      }

      await _supabase.from('deduction_logs').insert({
        student_id: currentStudentId,
        amount_money: amountMoney,
        deducted_points: ptsToDeduct,
        note: note
      });

      document.getElementById('deduct-note-input').value = '';
      document.getElementById('deduct-money-input').value = '';
      document.getElementById('deduct-points-input').value = '';

      loadData();
    }

    async function deleteDeductionLog(id) {
      await _supabase.from('deduction_logs').delete().eq('id', id);
      loadData();
    }

    function renderDeductionLogs() {
      const list = document.getElementById('deduction-log-list');
      list.innerHTML = '';

      if (deductionLogs.length === 0) {
        list.innerHTML = '<li class="text-slate-400 py-1 text-[11px]">尚無扣除紀錄</li>';
        return;
      }

      deductionLogs.forEach(log => {
        const li = document.createElement('li');
        li.className = 'py-1 flex justify-between items-center text-[11px]';
        const moneyDesc = log.amount_money > 0 ? `($${log.amount_money}元)` : '';

        li.innerHTML = `
          <div>
            <span class="font-bold text-rose-600">-${log.deducted_points} 點</span>
            <span class="text-slate-700 font-medium ml-1">${log.note} ${moneyDesc}</span>
          </div>
          <button onclick="deleteDeductionLog(${log.id})" class="text-slate-400 hover:text-rose-600 font-bold">刪除</button>
        `;
        list.appendChild(li);
      });
    }

    async function loadExtraScores() {
      const { data: allExtra } = await _supabase
        .from('extra_scores')
        .select('*')
        .eq('student_id', currentStudentId);

      const list = document.getElementById('extra-list');
      list.innerHTML = '';

      let weekExtraTotal = 0;
      let allExtraTotal = 0;

      if (allExtra) {
        allExtra.forEach(item => {
          allExtraTotal += item.points;

          if (item.date >= weekDates[0] && item.date <= weekDates[6]) {
            weekExtraTotal += item.points;

            const li = document.createElement('li');
            li.className = 'py-2 flex justify-between items-center';

            li.innerHTML = `
              <div class="flex items-center gap-3">
                <div>
                  <span class="font-bold ${item.points >= 0 ? 'text-emerald-600' : 'text-rose-600'}">${item.points >= 0 ? '+' : ''}${item.points} 點</span>
                  <span class="ml-2 text-slate-600">${item.note}</span>
                  <span class="ml-2 text-xs text-slate-400">(${item.date})</span>
                </div>
              </div>
              <button onclick="deleteExtraScore(${item.id})" class="text-xs text-slate-400 hover:text-rose-500">刪除</button>
            `;
            list.appendChild(li);
          }
        });
      }

      window.weekExtraTotal = weekExtraTotal;
      window.allExtraTotal = allExtraTotal;
      calculateTotal();
    }

    async function addExtraScore() {
      const note = document.getElementById('extra-note').value;
      const points = parseInt(document.getElementById('extra-points').value);
      const today = weekDates[0];

      if (!note || isNaN(points)) return alert('請填寫完整事項與加減分數！');

      await _supabase.from('extra_scores').insert({
        student_id: currentStudentId,
        date: today,
        points: points,
        note: note
      });

      document.getElementById('extra-note').value = '';
      document.getElementById('extra-points').value = '';

      loadData();
    }

    async function deleteExtraScore(id) {
      await _supabase.from('extra_scores').delete().eq('id', id);
      loadData();
    }

    function openImageModal(url) {
      document.getElementById('modal-img').src = url;
      document.getElementById('image-modal').classList.remove('hidden');
    }

    function closeImageModal() {
      document.getElementById('image-modal').classList.add('hidden');
    }

    function calculateTotal() {
      let weekBaseTotal = 0;
      Object.entries(currentWeekScores).forEach(([key, grade]) => {
        if (!key.includes('TABLE_PHOTO')) {
          weekBaseTotal += GRADE_MAP[grade] || 0;
        }
      });
      const weekFinalPoints = weekBaseTotal + (window.weekExtraTotal || 0);
      const weekFinalMoney = Math.max(0, weekFinalPoints * 5);

      document.getElementById('week-points').innerText = weekFinalPoints;
      document.getElementById('week-money').innerText = weekFinalMoney;

      let totalEarnedPoints = 0;
      if (manualBasePoints !== null) {
        totalEarnedPoints = manualBasePoints;
      } else {
        let allBaseTotal = 0;
        allTimeScores.forEach(s => {
          if (s.item_name !== 'TABLE_PHOTO') {
            allBaseTotal += s.score || 0;
          }
        });
        totalEarnedPoints = allBaseTotal + (window.allExtraTotal || 0);
      }

      let totalDeductedPoints = 0;
      deductionLogs.forEach(log => {
        totalDeductedPoints += log.deducted_points || 0;
      });

      const totalRemainingPoints = totalEarnedPoints - totalDeductedPoints;
      const totalRemainingMoney = Math.max(0, totalRemainingPoints * 5);

      document.getElementById('total-points').innerText = totalRemainingPoints;
      document.getElementById('total-money').innerText = totalRemainingMoney;
    }

    // 初始化
    updateWeekDisplay();
    switchStudent(1);
  </script>
</body>
</html>
