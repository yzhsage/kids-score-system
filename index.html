<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>兒童行為紀錄系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* 凍結表格第一欄 (Sticky Column) */
    .sticky-col {
      position: sticky;
      left: 0;
      z-index: 20;
    }
  </style>
</head>
<body id="app-body" class="bg-slate-100 min-h-screen text-slate-800 pb-12 transition-colors duration-300">

  <div class="max-w-5xl mx-auto p-4 space-y-6">
    
    <header class="bg-white rounded-xl shadow p-4 flex flex-col md:flex-row justify-between items-center gap-4 border-t-4" id="header-border">
      <div>
        <h1 class="text-2xl font-bold text-slate-800" id="app-title">📋 兒童行為紀錄系統</h1>
        <p class="text-xs text-slate-500">雙人同步 · 成長趨勢追蹤 · 免費備份</p>
      </div>

      <div class="flex bg-slate-100 p-1 rounded-lg gap-1 border">
        <button id="btn-duoduo" onclick="switchStudent(1)" class="px-5 py-2 rounded-md font-bold text-sm transition">👦 多多 (藍)</button>
        <button id="btn-qiuqiu" onclick="switchStudent(2)" class="px-5 py-2 rounded-md font-bold text-sm transition">👦 球球 (紅)</button>
      </div>
    </header>

    <div class="bg-white rounded-xl p-3 shadow border text-xs flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <span class="font-bold text-slate-700">🤖 AI 白板辨識 Key:</span>
        <input type="password" id="gemini-key-input" placeholder="貼上 Gemini API Key" class="border rounded px-2 py-1 text-xs w-48">
        <button onclick="saveGeminiKey()" class="bg-slate-700 text-white px-3 py-1 rounded hover:bg-slate-800">儲存</button>
      </div>
      <span class="text-slate-400">※ 設定後上傳白板照即可點擊 AI 辨識</span>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      
      <div class="bg-white p-4 rounded-xl shadow border-l-4 flex flex-col justify-between" id="card-weekly">
        <div>
          <div class="flex justify-between items-center mb-1">
            <span class="text-xs font-bold text-slate-400">當週得分</span>
            <div class="flex items-center gap-1 text-xs">
              <button onclick="changeWeek(-1)" class="px-2 py-0.5 bg-slate-100 rounded hover:bg-slate-200">‹ 上週</button>
              <button onclick="resetToCurrentWeek()" class="px-2 py-0.5 bg-slate-100 rounded hover:bg-slate-200">本週</button>
              <button onclick="changeWeek(1)" class="px-2 py-0.5 bg-slate-100 rounded hover:bg-slate-200">下週 ›</button>
            </div>
          </div>
          <div class="text-xs text-slate-500 font-medium" id="week-range-label">計算中...</div>
          <div class="text-3xl font-extrabold mt-2" id="weekly-score">0 <span class="text-sm font-normal text-slate-500">點</span></div>
        </div>
        <div class="text-xs text-slate-500 mt-2">約折算零用錢：<span id="weekly-money" class="font-bold text-emerald-600">$0</span> 元</div>
      </div>

      <div class="bg-white p-4 rounded-xl shadow border-l-4 border-amber-500 flex flex-col justify-between">
        <div>
          <div class="flex justify-between items-center mb-1">
            <span class="text-xs font-bold text-slate-400">歷史總累積點數</span>
            <button onclick="toggleAdjustModal()" class="text-xs bg-amber-50 text-amber-700 px-2 py-0.5 rounded border border-amber-200 hover:bg-amber-100">⚙️ 微調/扣點</button>
          </div>
          <div class="text-3xl font-extrabold text-amber-600 mt-2" id="total-score">0 <span class="text-sm font-normal text-slate-500">點</span></div>
        </div>
        <div class="text-xs text-slate-500 mt-2">可換領零用錢總額：<span id="total-money" class="font-bold text-emerald-600">$0</span> 元</div>
      </div>

      <div class="bg-white p-4 rounded-xl shadow border-l-4 border-purple-500 flex flex-col justify-between">
        <div>
          <div class="flex justify-between items-center mb-1">
            <span class="text-xs font-bold text-slate-400">當週白板照片</span>
            <label class="cursor-pointer bg-purple-600 hover:bg-purple-700 text-white text-xs px-2 py-1 rounded">
              📸 上傳照片
              <input type="file" id="whiteboard-upload" accept="image/*" class="hidden" onchange="uploadWhiteboardPhoto(this)">
            </label>
          </div>
          <div id="photo-preview-container" class="mt-2 text-center">
            <p class="text-xs text-slate-400 py-3">未上傳照片</p>
          </div>
        </div>
        <button id="btn-ocr" onclick="runGeminiOCR()" class="w-full mt-2 bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold text-xs py-1.5 rounded shadow hidden">
          ✨ 啟動 AI 辨識自動填表
        </button>
      </div>

    </div>

    <div class="bg-white rounded-xl shadow overflow-hidden">
      <div class="p-4 bg-slate-50 border-b flex justify-between items-center">
        <h2 class="font-bold text-slate-700 flex items-center gap-2">🗓️ 當週每日行為紀錄表</h2>
        <span class="text-xs text-slate-400">評級：A (+3) | B (+1) | C (0) | D (-1) | E (-2)</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-center text-sm border-collapse">
          <thead>
            <tr class="bg-slate-100 text-xs text-slate-600 border-b" id="table-header">
              </tr>
          </thead>
          <tbody id="table-body" class="divide-y divide-slate-100">
            </tbody>
        </table>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow p-4 space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h2 class="font-bold text-slate-700">📝 額外加減分與扣除零用錢明細</h2>
        <button onclick="toggleAddLogModal()" class="bg-slate-800 text-white text-xs px-3 py-1.5 rounded font-bold shadow hover:bg-slate-700">
          ＋ 新增紀錄
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs border-collapse">
          <thead>
            <tr class="bg-slate-50 border-b text-slate-500">
              <th class="p-2">發生日期</th>
              <th class="p-2">類別</th>
              <th class="p-2">說明 / 備註</th>
              <th class="p-2 text-right">變動點數</th>
              <th class="p-2 text-right">換算金額</th>
            </tr>
          </thead>
          <tbody id="log-table-body" class="divide-y divide-slate-100">
            </tbody>
        </table>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow p-4 space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h2 class="font-bold text-slate-700">📈 小朋友成長進步趨勢</h2>
        <span class="text-xs text-slate-400">一起看點數累積過程！</span>
      </div>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <h3 class="text-xs font-bold text-slate-500 mb-2 text-center">每週得分趨勢 (近 8 週)</h3>
          <div class="h-48"><canvas id="chart-weekly-trend"></canvas></div>
        </div>
        <div>
          <h3 class="text-xs font-bold text-slate-500 mb-2 text-center">本週各行為表現分布</h3>
          <div class="h-48"><canvas id="chart-item-distribution"></canvas></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // Supabase 設定
    const SUPABASE_URL = 'https://mghhdyhbgjrrvxoqfkct.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_uAyNrVMDY2W63c0ujUPwUg_347hhWbW';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentStudentId = 1; // 1: 多多, 2: 球球
    let currentWeekOffset = 0;
    let trendChart = null;
    let distChart = null;

    window.onload = function() {
      loadGeminiKey();
      switchStudent(1);
    };

    function loadGeminiKey() {
      const key = localStorage.getItem('GEMINI_API_KEY') || '';
      document.getElementById('gemini-key-input').value = key;
    }

    function saveGeminiKey() {
      const key = document.getElementById('gemini-key-input').value.trim();
      localStorage.setItem('GEMINI_API_KEY', key);
      alert('Gemini API Key 已儲存！');
    }

    // 切換小朋友與配色調整
    function switchStudent(id) {
      currentStudentId = id;
      const isDuoduo = id === 1;
      
      // 按鈕狀態
      document.getElementById('btn-duoduo').className = isDuoduo ? 'px-5 py-2 rounded-md font-bold text-sm bg-blue-600 text-white shadow' : 'px-5 py-2 rounded-md font-bold text-sm text-slate-600';
      document.getElementById('btn-qiuqiu').className = !isDuoduo ? 'px-5 py-2 rounded-md font-bold text-sm bg-rose-600 text-white shadow' : 'px-5 py-2 rounded-md font-bold text-sm text-slate-600';
      
      // 主題框色調整
      document.getElementById('header-border').className = `bg-white rounded-xl shadow p-4 flex flex-col md:flex-row justify-between items-center gap-4 border-t-4 ${isDuoduo ? 'border-blue-500' : 'border-rose-500'}`;
      document.getElementById('card-weekly').className = `bg-white p-4 rounded-xl shadow border-l-4 flex flex-col justify-between ${isDuoduo ? 'border-blue-500' : 'border-rose-500'}`;
      document.getElementById('weekly-score').className = `text-3xl font-extrabold mt-2 ${isDuoduo ? 'text-blue-600' : 'text-rose-600'}`;

      renderApp();
    }

    function changeWeek(offset) {
      currentWeekOffset += offset;
      renderApp();
    }

    function resetToCurrentWeek() {
      currentWeekOffset = 0;
      renderApp();
    }

    function renderApp() {
      // 這裡載入歷史資料、渲染表格與圖表
      renderCharts();
    }

    // 圖表模組：展現成長趨勢
    function renderCharts() {
      const isDuoduo = currentStudentId === 1;
      const themeColor = isDuoduo ? '#2563eb' : '#e11d48';

      // 1. 每週總分趨勢
      const ctx1 = document.getElementById('chart-weekly-trend').getContext('2d');
      if (trendChart) trendChart.destroy();
      trendChart = new Chart(ctx1, {
        type: 'line',
        data: {
          labels: ['W1', 'W2', 'W3', 'W4', 'W5', 'W6', 'W7', '本週'],
          datasets: [{
            label: isDuoduo ? '多多每週得分' : '球球每週得分',
            data: [15, 18, 12, 22, 20, 25, 21, 28],
            borderColor: themeColor,
            backgroundColor: themeColor,
            tension: 0.3
          }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });

      // 2. 當週分項得分分布
      const ctx2 = document.getElementById('chart-item-distribution').getContext('2d');
      if (distChart) distChart.destroy();
      distChart = new Chart(ctx2, {
        type: 'bar',
        data: {
          labels: ['起床', '宿題', '收冊包', '洗身軀', '算術'],
          datasets: [{
            label: '獲得點數',
            data: [18, 15, 21, 18, 12],
            backgroundColor: themeColor
          }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    function uploadWhiteboardPhoto(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('photo-preview-container').innerHTML = 
            `<img src="${e.target.result}" class="max-h-20 mx-auto rounded border cursor-pointer" onclick="window.open('${e.target.result}')">`;
          document.getElementById('btn-ocr').classList.remove('hidden');
        };
        reader.readAsDataURL(input.files[0]);
      }
    }
  </script>
</body>
</html>
